# Candidate site proof: build every demo from the qualified Shallot full SHA and install that
# same immutable Git identity in each ejected consumer. Pushes build and archive only; deployment
# is restricted to workflow_dispatch with explicit opt-in and both Cloudflare credentials.

name: site-staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Explicitly deploy this candidate to the staging Pages project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_OUT_REQUIRED: "1"
      CF_DEPLOY_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_staging && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run candidate
      - run: bun run build --candidate

      - run: bun run check
      - run: bun run test
      - run: bun run scripts/check-site.ts

      - uses: actions/upload-artifact@v4
        with:
          name: site-candidate
          path: out/site

      - name: Deploy candidate to Cloudflare Pages
        if: ${{ env.CF_DEPLOY_READY == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/site --project-name=shallot-staging --branch=main
