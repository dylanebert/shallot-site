# Staging site proof. Pushes build and archive only; external staging work is explicit manual opt-in.
name: site-staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Upload maps and deploy this staging build to Cloudflare Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_OUT_REQUIRED: "1"
      CF_DEPLOY_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_staging && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.DD_API_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run build --staging

      - run: bun run check
      - run: bun run test
      - run: bun test --timeout=250 ./scripts/staging-workflow.oracle.ts
      - run: bun run scripts/check-site.ts

      - uses: actions/upload-artifact@v4
        with:
          name: site-staging
          path: out/site

      - name: Create or verify named staging project
        id: pages
        if: ${{ env.CF_DEPLOY_READY == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run scripts/staging-project.ts

      - name: Upload source maps for this build
        if: ${{ env.CF_DEPLOY_READY == 'true' }}
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
        run: bun run sourcemaps:upload -- --upload out/site "${{ steps.pages.outputs.hostname }}"

      - name: Deploy the same identified build to Cloudflare Pages
        if: ${{ env.CF_DEPLOY_READY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --no-install wrangler pages deploy out/site --project-name=shallot-staging --branch=main
